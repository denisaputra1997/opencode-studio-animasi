<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Studio — Kantor Agent (Isometric)</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="status">menghubungkan…</div>
    <div id="output"></div>
    <div id="legend">
      <span><i style="background: #95a5a6"></i>IDLE</span>
      <span><i style="background: #2ecc71"></i>WORKING</span>
      <span><i style="background: #3498db"></i>THINKING</span>
      <span><i style="background: #f1c40f"></i>DONE</span>
      <span><i style="background: #e74c3c"></i>BLOCKED</span>
      <span><i style="background: #9b59b6"></i>MEETING</span>
    </div>
    <div id="game"></div>
    <form id="prompt-form">
      <input
        id="prompt-input"
        type="text"
        placeholder="Tulis prompt proyek…"
        autocomplete="off"
      />
      <button type="submit">Kirim</button>
      <button type="button" id="stop-btn">Stop</button>
    </form>
    <script type="module" src="/src/game.js"></script>
  </body>
</html>
